name: Sentiment analysis (artifact validation)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sentiment.yml']
  workflow_run:
    workflows: ["YouTube Comment Collector"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: sentiment-artifact-validation
  cancel-in-progress: false

jobs:
  analyse:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'Hackathon 6/requirements-sentiment.txt'
      - uses: actions/cache@v4
        with:
          path: 'Hackathon 6/.model-cache'
          key: sentiment-linux-roberta-3216a57f2a0d9c45a2e6c20157c20c49fb4bf9c7-v1
      - name: Install CPU inference dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r 'Hackathon 6/requirements-sentiment.txt'
      - name: Run isolated pipeline tests
        run: python -m unittest discover -s 'Hackathon 6/tests' -p 'test_pipeline.py' -v
      - name: Record input commit
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Analyse real comments and verify preservation
        run: >-
          python 'Hackathon 6/automation/run_ci.py'
          --input 'Hackathon 6/data/youtube_comments.csv'
          --output '${{ runner.temp }}/sentiment/sentiment_results.csv'
          --status '${{ runner.temp }}/sentiment/processing_status.csv'
          --cache-dir 'Hackathon 6/.model-cache'
          --revision 3216a57f2a0d9c45a2e6c20157c20c49fb4bf9c7
          --device cpu --batch-size 16 --threads 2 --retry-failed
      - name: Preserve results and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          path: '${{ runner.temp }}/sentiment/'
          if-no-files-found: warn
          retention-days: 3
